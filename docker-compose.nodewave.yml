x-nodewave-logging: &nodewave-logging
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "5"

services:
  api-gw:
    <<: *nodewave-logging

  studio:
    <<: *nodewave-logging

  auth:
    <<: *nodewave-logging
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS:-[]}

  rest:
    <<: *nodewave-logging

  realtime:
    <<: *nodewave-logging
    environment:
      API_JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

  storage:
    <<: *nodewave-logging
    environment:
      JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}

  db:
    <<: *nodewave-logging

  functions:
    <<: *nodewave-logging
    environment:
      SUPABASE_JWKS: ${JWT_JWKS:-{"keys":[]}}