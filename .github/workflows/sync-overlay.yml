name: Sync Nodewave Overlay via PR

on:
  push:
    branches:
      - main
    paths:
      - ".nodewave-overlays"
      - "nodewave/**"
      - "*nodewave*"
      - "**/*nodewave*"
      - "README.md"
  workflow_dispatch:
    inputs:
      branch:
        description: "Specific release/v* branch to target (leave empty for all release/v* branches)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.find.outputs.branches }}
      has_branches: ${{ steps.find.outputs.has_branches }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target release branches
        id: find
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            TARGET="${{ github.event.inputs.branch }}"
            if git show-ref --verify --quiet "refs/remotes/origin/${TARGET}"; then
              JSON=$(printf '["%s"]' "$TARGET")
              echo "branches=$JSON" >> "$GITHUB_OUTPUT"
              echo "has_branches=true" >> "$GITHUB_OUTPUT"
            else
              echo "Branch origin/${TARGET} does not exist." >&2
              exit 1
            fi
          else
            BRANCH_LIST=$(git branch -r --list 'origin/release/v*' | sed 's|^[[:space:]]*origin/||' | sort -V)
            if [ -z "$BRANCH_LIST" ]; then
              echo "branches=[]" >> "$GITHUB_OUTPUT"
              echo "has_branches=false" >> "$GITHUB_OUTPUT"
            else
              JSON=$(printf '%s\n' "$BRANCH_LIST" | jq -R . | jq -sc .)
              echo "branches=$JSON" >> "$GITHUB_OUTPUT"
              echo "has_branches=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  create-pr:
    needs: discover
    if: needs.discover.outputs.has_branches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Sync Nodewave overlay paths from main manifest
        id: sync
        run: |
          set -euo pipefail

          MANIFEST=$(git show origin/main:.nodewave-overlays \
            | grep -Ev '^[[:space:]]*(#|$)' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue

            if [[ "$pattern" == */ ]]; then
              dir="${pattern%/}"
              rm -rf "$dir"
              if git cat-file -e "origin/main:${dir}" 2>/dev/null; then
                git checkout origin/main -- "$dir"
              fi
            elif [[ "$pattern" == *'*'* || "$pattern" == *'?'* || "$pattern" == *'['* ]]; then
              while IFS= read -r existing; do
                [ -n "$existing" ] && rm -f "$existing"
              done < <(git ls-files "$pattern")

              while IFS= read -r matched; do
                [ -n "$matched" ] && git checkout origin/main -- "$matched"
              done < <(git ls-tree -r --name-only origin/main -- "$pattern")
            else
              rm -f "$pattern"
              if git cat-file -e "origin/main:${pattern}" 2>/dev/null; then
                git checkout origin/main -- "$pattern"
              fi
            fi
          done <<< "$MANIFEST"

          git reset HEAD

      - name: Open or update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ matrix.branch }}
          branch: "sync/overlay-${{ matrix.branch }}"
          delete-branch: true
          commit-message: "chore(nodewave): sync overlay updates to ${{ matrix.branch }}"
          title: "chore(nodewave): sync overlay updates to ${{ matrix.branch }}"
          body: |
            Automated backport of Nodewave overlay changes from `main` (`${{ github.sha }}`) into **`${{ matrix.branch }}`** using `.nodewave-overlays` as the source of truth.

            > Upstream Supabase files (`docker-compose.yml`, `volumes/`, `.upstream-version`) are untouched.