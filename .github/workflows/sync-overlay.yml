name: Sync Nodewave Overlay via PR

on:
  push:
    branches:
      - main
    paths:
      - ".nodewave-overlays"
      - ".github/workflows/sync-overlay.yml"
      - "nodewave/**"
      - "*nodewave*"
      - "**/*nodewave*"
      - "README.md"
  workflow_dispatch:
    inputs:
      branch:
        description: "Specific release/v* branch to target (leave empty for all release/v* branches)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.find.outputs.branches }}
      has_branches: ${{ steps.find.outputs.has_branches }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target release branches
        id: find
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            TARGET="${{ github.event.inputs.branch }}"
            if git show-ref --verify --quiet "refs/remotes/origin/${TARGET}"; then
              JSON=$(printf '["%s"]' "$TARGET")
              echo "branches=$JSON" >> "$GITHUB_OUTPUT"
              echo "has_branches=true" >> "$GITHUB_OUTPUT"
            else
              echo "Branch origin/${TARGET} does not exist." >&2
              exit 1
            fi
          else
            BRANCH_LIST=$(git branch -r --list 'origin/release/v*' | sed 's|^[[:space:]]*origin/||' | sort -V)
            if [ -z "$BRANCH_LIST" ]; then
              echo "branches=[]" >> "$GITHUB_OUTPUT"
              echo "has_branches=false" >> "$GITHUB_OUTPUT"
            else
              JSON=$(printf '%s\n' "$BRANCH_LIST" | jq -R . | jq -sc .)
              echo "branches=$JSON" >> "$GITHUB_OUTPUT"
              echo "has_branches=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  create-pr:
    needs: discover
    if: needs.discover.outputs.has_branches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Sync Nodewave overlay paths from main manifest
        run: |
          set -euo pipefail
          git fetch origin main

          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          manifest_raw = git("show", "origin/main:.nodewave-overlays")
          patterns = [
              line.strip()
              for line in manifest_raw.splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]

          def matches(path: str) -> bool:
              for pat in patterns:
                  if pat.endswith("/"):
                      if path.startswith(pat):
                          return True
                  elif fnmatch.fnmatch(path, pat) or fnmatch.fnmatch(os.path.basename(path), pat):
                      return True
              return False

          # 1. Remove currently tracked overlay files so deletions on main propagate cleanly
          tracked = [f for f in git("ls-files").splitlines() if f]
          for f in tracked:
              if matches(f) and os.path.exists(f):
                  os.remove(f)

          # 2. Check out all matching overlay files from origin/main in a single pass
          main_files = [f for f in git("ls-tree", "-r", "--name-only", "origin/main").splitlines() if f]
          to_checkout = sorted({f for f in main_files if matches(f)})

          print("Syncing overlay files:", ", ".join(to_checkout))
          if to_checkout:
              subprocess.run(["git", "checkout", "origin/main", "--", *to_checkout], check=True)
              subprocess.run(["git", "reset", "HEAD", "--", *to_checkout], check=True)
          PY

      - name: Open or update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ matrix.branch }}
          branch: "sync/overlay-${{ matrix.branch }}"
          delete-branch: true
          commit-message: "chore(nodewave): sync overlay updates to ${{ matrix.branch }}"
          title: "chore(nodewave): sync overlay updates to ${{ matrix.branch }}"
          body: |
            Automated backport of Nodewave overlay changes from `main` (`${{ github.sha }}`) into **`${{ matrix.branch }}`** using `.nodewave-overlays` as the source of truth.

            > Upstream Supabase files (`docker-compose.yml`, `volumes/`, `.upstream-version`) are untouched.